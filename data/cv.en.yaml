work:
  - name: Rawson BPO
    position: Fullstack Software Consultant & Python Backend
    location: Spain (fully remote)
    startDate: 2023-10
    summary: Hired by Rawson BPO as an external consultant for **Thinkia** (end client).
    groups:
      - name: SegurCaixa Adeslas
        note: in development
        highlights:
          - Building single-handedly a pet insurance sales platform with a **FastAPI** API (107 endpoints, 94% coverage), two **React 19** front ends, signed webhooks with a **transactional outbox** and a visual CMS with no deployments.
      - name: Culligan Spain & Portugal
        highlights:
          - Designed and built almost single-handedly (~97% of 720+ commits across 15 repos) the online subscription sales platform with a **Shopify** funnel, **8 Python microservices on GCP Cloud Run** and a **Next.js** analytics dashboard.
          - Built the Shopify → CRM order **webhook** with HMAC verification, atomic de-duplication in **Firestore** and idempotent reprocessing; contracts are created only after payment.
          - Consolidated the services onto a **versioned internal Python library** and set up **keyless CI/CD** (OIDC + Workload Identity) with 1,100+ tests and 90–95% coverage gates.
      - name: SEB Business
        highlights:
          - "**SEB One** (payments & invoicing, 7 countries): main developer of the **Django/DRF** backend (~67% of 1,450 commits), with ~1,500 tests and 88% coverage."
          - Built an Excel → **Parquet** → PostgreSQL ETL (~590k invoice lines) and settlement parsers for 9+ payment providers; migrated services and storage from **GCP to Huawei Cloud**.
          - "**SEB Markets**: in testing and integration, strengthened the public **FastAPI** gateway against the OWASP Top 10 (dependency vulnerabilities 28 → 0; 506 tests, 99% coverage)."
      - name: K-12 international school
        highlights:
          - Rewrote a .NET school management system in **Django** on its live shared **SQL Server**, with ASP.NET Identity-compatible login and PDF/Excel report cards and grade records; the student page went from 193 s to 1.6 s.
    technologies: [Python, Django REST Framework, FastAPI, React, TypeScript, Next.js, Shopify, PostgreSQL, SQL Server, Firestore, MongoDB, Celery, GCP Cloud Run, Huawei Cloud, AWS EC2, Docker, Pytest, Sentry, Claude Code]

  - name: Zona Repuestera
    position: Fullstack Developer (freelance)
    location: Colombia (remote)
    url: https://zonarepuestera.com.co
    startDate: 2026-09
    summary: A live auto-parts e-commerce I modernize independently, alongside my main role.
    highlights:
      - Leading the e-commerce rewrite to **FastAPI + Next.js + React** using the **strangler fig** pattern on the same database, verified by **1,445 contract tests** against the current system.
      - New async backend (~128 endpoints, **SQLAlchemy 2**) with **Wompi** payments, **Google Merchant** sync, an API for a WhatsApp bot and an admin panel typed from **OpenAPI**.
    technologies: [FastAPI, SQLAlchemy, Next.js, React, TypeScript, PostgreSQL, Wompi, Google Merchant API, Playwright, GitHub Actions]

