principles:
  - title: I adapt to the challenge
    description: From a .NET monolith on SQL Server to serverless microservices or a cloud migration. I pick the solution for the business need, not for the hype.
  - title: Quality without shortcuts
    description: Layered architecture, a pure domain, strict typing and CI that lets no regression through. I deliver at the highest quality I can.
  - title: OWASP Top 10 security
    description: Security is part of the design. Fail-closed authentication, secrets out of the code, audited dependencies and an OWASP Top 10 review on every project.
  - title: Coverage close to 100%
    description: I want everything that matters to be tested. My recent projects sit between 88% and 99% coverage, with mandatory floors in CI.
  - title: Attention to detail
    description: A thousands separator, a clock stepping back or an in-app browser can break a system. I find these issues, explain them and fix them.
  - title: Judgment and improvement ideas
    description: I give my technical opinion and proactively suggest improvements, from the product to how the team works.
  - title: Hands-on support
    description: I support clients and end users in adopting the tools, with documentation, training and close follow-up.

