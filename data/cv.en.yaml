    highlights:
      - Built a **Python library** that helps data analysts and data scientists **compare and pick the best model** for each use case, integrated into their workflows.
      - Built data integration pipelines feeding automation modules and **predictive models** over large data volumes.
      - Monitored performance with **DataDog** and **Kibana**, diagnosing bottlenecks and improving ecosystem resilience.
      - Provisioned and deployed infrastructure as code with **CloudFormation** on AWS (Lambda, S3, EC2) in distributed agile teams.
    technologies: [Python, Django REST Framework, Flask, JavaScript, DynamoDB, AWS, CloudFormation, Docker, DataDog, Kibana]

