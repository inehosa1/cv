work:
  - name: Thinkia
    position: Software Engineer
    location: Spain (fully remote)
    startDate: 2026-10
    summary: Joined as a full-time employee after 3 years as an external consultant through Rawson BPO, continuing with the same clients.
    groups:
      - name: Leading Spanish insurer
        highlights:
          - Single-handedly built and shipped to production in 2 weeks a pet insurance sales platform with a **FastAPI** API (122 endpoints), two **React 19** front ends, signed webhooks with a transactional outbox and a visual CMS with no deployments.
          - Ensured quality with **440+ tests** (185 backend, 227 front end and 36 e2e) and **97% coverage** on the API.
          - Implemented technical SEO and AI-search optimization with **Playwright** pre-rendering, 50 province landing pages, **JSON-LD** and llms.txt, plus an API-generated sitemap.
      - name: Water treatment multinational (Spain & Portugal)
        highlights:
          - Designed and built almost single-handedly (~98% of 770+ commits across 15 repos) the online subscription sales platform with a **Shopify** funnel, **8 Python microservices on GCP Cloud Run** and a **Next.js** analytics dashboard, with 1,100+ tests.
          - Built the Shopify → CRM order **webhook** with HMAC verification, atomic de-duplication in **Firestore** and idempotent reprocessing; contracts are created only after payment.
          - Launched the **Portugal** store on the same codebase, with pt-PT translation, NIF, postcode and phone validation, and per-country analytics (GA4, Meta pixel and CAPI) and consent on a dedicated **Cloud Run** cluster.
          - Closed an **OWASP Top 10** audit with 10 findings fixed (authentication, fail-closed HMAC, CORS, XSS) and automated the reprocessing of failed orders and leads to the CRM.
      - name: European e-commerce & payments group
        highlights:
          - "**Payments & invoicing back office** (7 countries): main developer of the **Django/DRF** backend (~67% of 1,450 commits), with ~1,500 tests and 88% coverage."
          - Built an Excel → **Parquet** → PostgreSQL ETL (~600k invoice lines) and settlement parsers for 9+ payment providers; migrated services and storage from **GCP to Huawei Cloud**.
          - "**Multi-marketplace platform** (Amazon, Fnac and 3 other marketplaces): hardened the public **FastAPI** gateway and the Amazon and Fnac connectors against the **OWASP Top 10** (JWT, encrypted credentials, SSRF; dependency vulnerabilities 28 → 0) and wrote **4,200+ tests** across 3 backends."
          - Designed automatic marketplace order sync (every 2 min, with alerting) and set up 8 **Jenkins** deployment pipelines on **Huawei Cloud**.
    technologies: [Python, Django REST Framework, FastAPI, React, TypeScript, Next.js, Shopify, PostgreSQL, Firestore, MongoDB, Celery, GCP Cloud Run, Huawei Cloud, Docker, Jenkins, Pytest, Playwright, Sentry, Claude Code]

