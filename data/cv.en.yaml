work:
  - name: Rawson BPO
    position: Fullstack Software Consultant & Python Backend
    location: Spain (fully remote)
    startDate: 2023-10
    summary: External consultant assigned to **Thinkia** and **Eanmatic**, owning production platforms for Culligan and SEB Business.
    highlights:
      - "**Culligan Spain & Portugal:** designed and built almost single-handedly (~97% of 720+ commits across 15 repos) the online subscription sales platform: **Shopify** funnel, **8 Python microservices on GCP Cloud Run** and a **Next.js** analytics dashboard."
      - Built the Shopify → CRM order **webhook** with HMAC verification, atomic de-duplication in **Firestore**, automatic rebuild and idempotent reprocessing; contracts are created only after payment.
      - Consolidated 8 services onto a **versioned internal Python library** (fail-closed auth, PII redaction) and set up **keyless CI/CD** (OIDC + Workload Identity) with 1,100+ tests and 90–95% coverage gates.
      - Launched Portugal with per-request **multi-market** resolution, idempotent catalog migration via **Shopify GraphQL**, and server-side tracking (**GA4 Measurement Protocol**, **Meta CAPI**).
      - "**SEB One** (payments & invoicing back office, 7 countries): main developer of the **Django/DRF** backend (~67% of 1,450 commits): multi-tenancy, RBAC, credit notes, commissions, refunds and disputes; ~1,500 tests, 88% coverage."
      - Built an Excel → **Parquet** → PostgreSQL ETL (~590k invoice lines) and settlement parsers for 9+ payment providers (Adyen, PayPal, Klarna, Alma…); migrated services and storage from **GCP to Huawei Cloud**.
      - "**SEB Markets** (Amazon, eBay, Miravia, Mirakl, Fnac): hardened the public **FastAPI** gateway against the OWASP Top 10 (dependency vulnerabilities 28 → 0; 506 tests, 99% coverage) and added backoff retries and retry queues."
      - "Rolled out **AI-native** development across all repositories: **Claude Code** subagents, skills and hooks, plus Codex agents to expand test coverage."
    technologies: [Python, Django REST Framework, FastAPI, Flask, React, TypeScript, Next.js, Shopify, PostgreSQL, Firestore, MongoDB, Celery, Redis, GCP Cloud Run, Huawei Cloud, Docker, Jenkins, Pytest, Sentry, Claude Code]

  - name: Mercado Libre
    position: Software Engineer (Fullstack & Backend)
    location: Medellín, Colombia
    startDate: 2022-11
    endDate: 2023-11
    highlights:
      - Developed **Python (Django REST, Flask)** and JavaScript services to orchestrate and process real-time data flows across high-traffic subsystems.
      - Built data integration pipelines feeding automation modules and **predictive models** over large data volumes.
      - Monitored performance with **DataDog** and **Kibana**, diagnosing bottlenecks and improving ecosystem resilience.
      - Provisioned and deployed infrastructure as code with **CloudFormation** on AWS (Lambda, S3, EC2) in distributed agile teams.
    technologies: [Python, Django REST Framework, Flask, JavaScript, DynamoDB, AWS, CloudFormation, Docker, DataDog, Kibana]

  - name: Talenta
    position: Software Developer (Fullstack / Backend)
    location: Medellín, Colombia
    startDate: 2020-01
    endDate: 2022-11
    highlights:
      - Developed **Python (Django)** applications and APIs with **React** interfaces and **PostgreSQL** persistence, keeping code decoupled.
      - Designed relational schemas, ran controlled migrations and tuned indexes to handle high demand.
      - Drove a quality culture through cross code reviews, automated tests and API security standards.
      - Set up CI pipelines with **Docker** and **Jenkins** and provisioning with **Ansible** on AWS.
    technologies: [Python, Django, JavaScript, React, PostgreSQL, Docker, Jenkins, Ansible, AWS]

