home:
  headline: I'm Ricardo, a software engineer. I build Python backends and the React interfaces that use them.
  intro: >-
    For 8 years I've worked on product: payments and invoicing, multi-country e-commerce, integrations
    and migrations of systems that can't be switched off. I currently work at Thinkia, remotely from
    Medellín. Here I explain how some of those systems are built and why I made each decision.

principles:
  - title: Migrate without stopping operations
    description: I'd rather replace a system piece by piece, with tests that compare it against the original (contract tests, golden tests or a shared database), than rewrite it all at once.
    project: facturas-recibidas
  - title: Measure before claiming
    description: Before optimizing or quoting a number, I measure it. That's how a student page went from 193 s to 1.6 s; the problem was an N+1 query, not the server.
    project: gestion-escolar
  - title: Security and tests are part of the design
    description: Signed webhooks that fail closed, secrets kept out of the code and a coverage floor enforced by CI from the first commit, not at the end of the project.
    project: seguros-mascotas

