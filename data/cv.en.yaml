    position: Fullstack Developer (freelance)
    location: Colombia (remote)
    url: https://zonarepuestera.com.co
    startDate: 2025-06
    summary: A live auto-parts e-commerce I develop independently, alongside my main role.
    highlights:
      - Built the production system (~97% of 707 commits) on **Django/DRF**, with vehicle-compatibility search, **Wompi** payments, **Google Merchant** sync and an API for a WhatsApp bot.
      - Leading its rewrite to **FastAPI + Next.js + React** using the **strangler fig** pattern on the same database, verified by **1,445 contract tests** against the current system.
    technologies: [Django, FastAPI, Next.js, React, PostgreSQL, Wompi, Google Merchant API]

