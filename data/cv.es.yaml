home:
  headline: Soy Ricardo, ingeniero de software. Construyo backends en Python y las interfaces en React que los usan.
  intro: >-
    Llevo 8 años trabajando en producto: pagos y facturación, e-commerce multi-país, integraciones y
    migraciones de sistemas que no se pueden apagar. Hoy trabajo en Thinkia, en remoto desde Medellín.
    Aquí cuento cómo están hechos algunos de esos sistemas y por qué tomé cada decisión.

principles:
  - title: Migrar sin detener la operación
    description: Prefiero reemplazar un sistema por partes y con pruebas que lo comparen con el original (tests de contrato, golden tests o una base de datos compartida) a reescribirlo todo de una vez.
    project: facturas-recibidas
  - title: Medir antes de afirmar
    description: Antes de optimizar o de dar una cifra, la mido. Así la ficha de un alumno pasó de 193 s a 1,6 s; el problema era una consulta N+1, no el servidor.
    project: gestion-escolar
  - title: La seguridad y los tests son parte del diseño
    description: Webhooks firmados que fallan cerrados, secretos fuera del código y un mínimo de cobertura que el CI hace cumplir desde el primer commit, no al final del proyecto.
    project: seguros-mascotas

