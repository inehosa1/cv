principles:
  - title: Me adapto al reto
    description: De un monolito .NET con SQL Server a microservicios serverless o una migración de nube. Elijo la solución por la necesidad del negocio, no por moda.
  - title: Calidad sin atajos
    description: Arquitectura por capas, tipado estricto y CI que no deja pasar regresiones. Mis proyectos recientes tienen entre el 88 y el 99 % de cobertura, con mínimos obligatorios.
  - title: Seguridad OWASP Top 10
    description: La seguridad es parte del diseño. Autenticación fail-closed, secretos fuera del código, dependencias auditadas y revisión según OWASP Top 10 en cada proyecto.
  - title: Atención al detalle
    description: Un separador de miles, un reloj que retrocede o un navegador embebido pueden romper un sistema. Los detecto, los explico y los resuelvo.
  - title: Criterio e ideas de mejora
    description: Doy mi criterio técnico y propongo mejoras de forma proactiva, desde el producto hasta la forma de trabajar del equipo.
  - title: Acompañamiento
    description: Acompaño a clientes y usuarios finales en el uso de las herramientas con documentación, formación y soporte cercano.

