    position: Desarrollador Fullstack (freelance)
    location: Colombia (remoto)
    url: https://zonarepuestera.com.co
    startDate: 2025-06
    summary: E-commerce de autopartes en producción que desarrollo de forma independiente, en paralelo a mi puesto principal.
    highlights:
      - Construí el sistema en producción (~97 % de 707 commits) en **Django/DRF**, con búsqueda por compatibilidad de vehículo, pagos con **Wompi**, sincronización con **Google Merchant** y una API para un bot de WhatsApp.
      - Lidero su reescritura a **FastAPI + Next.js + React** con el patrón **strangler fig** sobre la misma base de datos, verificada con **1.445 tests de contrato** contra el sistema actual.
    technologies: [Django, FastAPI, Next.js, React, PostgreSQL, Wompi, Google Merchant API]

  - name: Mercado Libre
    position: Software Engineer (Backend)
    location: Medellín, Colombia
    startDate: 2022-11
    endDate: 2023-11
    highlights:
      - Desarrollé una **librería Python** que ayuda a analistas y científicos de datos a **comparar y elegir el mejor modelo** para cada caso, integrada en sus flujos de trabajo.
      - Construí pipelines de integración de datos que alimentaron módulos de automatización y **modelos predictivos** sobre grandes volúmenes.
      - Monitoreé rendimiento con **DataDog** y **Kibana**, diagnosticando cuellos de botella y mejorando la resiliencia del ecosistema.
      - Aprovisioné y desplegué infraestructura como código con **CloudFormation** sobre AWS (Lambda, S3, EC2) en equipos ágiles distribuidos.
    technologies: [Python, Django REST Framework, Flask, JavaScript, DynamoDB, AWS, CloudFormation, Docker, DataDog, Kibana]

  - name: Talenta
    position: Desarrollador de Software (Fullstack / Backend)
    location: Medellín, Colombia
    startDate: 2020-01
    endDate: 2022-11
    highlights:
      - Fui el **desarrollador principal** de un **sistema de medición de desempeño para psicólogos**, construido de punta a punta en **Django** (backend, plantillas HTML y JavaScript) sobre **PostgreSQL**.
      - Diseñé esquemas relacionales, ejecuté migraciones controladas y optimicé índices para responder a alta demanda.
      - Impulsé la cultura de calidad con code reviews cruzados, pruebas automatizadas y estándares de seguridad para APIs.
      - Configuré pipelines de CI con **Docker** y **Jenkins** y aprovisionamiento con **Ansible** sobre AWS.
