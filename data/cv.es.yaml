work:
  - name: Thinkia
    position: Software Engineer
    location: España (100 % remoto)
    startDate: 2026-10
    summary: Me incorporé a la plantilla tras 3 años como consultor externo vía Rawson BPO y continúo con los mismos clientes.
    groups:
      - name: Aseguradora líder en España
        highlights:
          - Construí en solitario y llevé a producción en 2 semanas la plataforma de venta de seguros para mascotas con una API **FastAPI** (122 endpoints), dos frontends **React 19**, webhooks firmados con transactional outbox y un CMS visual sin despliegues.
          - Aseguré la calidad con **más de 440 tests** (185 de backend, 227 de frontend y 36 e2e) y un **97 % de cobertura** en la API.
          - Implementé SEO técnico y para buscadores con IA con pre-render en **Playwright**, 50 páginas por provincia, **JSON-LD** y llms.txt, con un sitemap generado desde la API.
      - name: Multinacional de tratamiento de agua (España y Portugal)
        highlights:
          - Diseñé y construí casi en solitario (~98 % de 770+ commits en 15 repos) la venta online de suscripciones con funnel en **Shopify**, **8 microservicios Python en GCP Cloud Run** y un dashboard de analítica en **Next.js**, con más de 1.100 tests.
          - Implementé el **webhook** de pedidos Shopify → CRM con verificación HMAC, deduplicación atómica en **Firestore** y reproceso idempotente; el contrato solo se crea tras el pago.
          - Lancé la tienda de **Portugal** sobre el mismo código, con traducción pt-PT, validación de NIF, código postal y teléfono, y analítica (GA4, píxel de Meta y CAPI) y consentimiento separados por país en un clúster dedicado de **Cloud Run**.
          - Cerré una auditoría **OWASP Top 10** con 10 hallazgos corregidos (autenticación, HMAC fail-closed, CORS, XSS) y automaticé el reproceso de pedidos y leads fallidos hacia el CRM.
      - name: Grupo europeo de e-commerce y pagos
        highlights:
          - "**Back-office de pagos y facturación** (7 países): principal desarrollador del backend **Django/DRF** (~67 % de 1.450 commits), con ~1.500 tests y 88 % de cobertura."
          - Construí un ETL Excel → **Parquet** → PostgreSQL (~600k líneas de factura) y parsers de liquidaciones para 9+ pasarelas de pago; migré servicios y almacenamiento de **GCP a Huawei Cloud**.
          - "**Plataforma multi-marketplace** (Amazon, Fnac y otros 3 marketplaces): endurecí según **OWASP Top 10** la API pública **FastAPI** y los conectores de Amazon y Fnac (JWT, cifrado de credenciales, SSRF; vulnerabilidades 28 → 0) y escribí más de **4.200 tests** en 3 backends."
          - Diseñé la sincronización automática de pedidos de los marketplaces (cada 2 min, con alertas) y monté 8 pipelines **Jenkins** de despliegue en **Huawei Cloud**.
    technologies: [Python, Django REST Framework, FastAPI, React, TypeScript, Next.js, Shopify, PostgreSQL, Firestore, MongoDB, Celery, GCP Cloud Run, Huawei Cloud, Docker, Jenkins, Pytest, Playwright, Sentry, Claude Code]

