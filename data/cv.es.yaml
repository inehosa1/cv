work:
  - name: Rawson BPO
    position: Consultor de Software Fullstack & Backend Python
    location: España (100 % remoto)
    startDate: 2023-10
    summary: Contratado por Rawson BPO como consultor externo para **Thinkia** (cliente final).
    groups:
      - name: SegurCaixa Adeslas
        note: en desarrollo
        highlights:
          - Construyo en solitario la plataforma de venta de seguros para mascotas con una API **FastAPI** (107 endpoints, 94 % de cobertura), dos frontends **React 19**, webhooks firmados con **transactional outbox** y un CMS visual sin despliegues.
      - name: Culligan España y Portugal
        highlights:
          - Diseñé y construí casi en solitario (~97 % de 720+ commits en 15 repos) la venta online de suscripciones con funnel en **Shopify**, **8 microservicios Python en GCP Cloud Run** y un dashboard de analítica en **Next.js**.
          - Implementé el **webhook** de pedidos Shopify → CRM con verificación HMAC, deduplicación atómica en **Firestore** y reproceso idempotente; el contrato solo se crea tras el pago.
          - Unifiqué los servicios en una **librería Python interna versionada** y monté **CI/CD sin llaves** (OIDC + Workload Identity) con más de 1.100 tests y cobertura mínima del 90–95 %.
      - name: SEB Business
        highlights:
          - "**SEB One** (pagos y facturación, 7 países): principal desarrollador del backend **Django/DRF** (~67 % de 1.450 commits), con ~1.500 tests y 88 % de cobertura."
          - Construí un ETL Excel → **Parquet** → PostgreSQL (~590k líneas de factura) y parsers de liquidaciones para 9+ pasarelas de pago; migré servicios y almacenamiento de **GCP a Huawei Cloud**.
          - "**SEB Markets**: en pruebas e integración, reforcé la API pública **FastAPI** según OWASP Top 10 (vulnerabilidades de dependencias 28 → 0; 506 tests, 99 % de cobertura)."
      - name: Colegio internacional K-12
        highlights:
          - Reescribí en **Django** un sistema de gestión escolar .NET compartiendo su **SQL Server** en producción, con login compatible con ASP.NET Identity y boletines y actas en PDF/Excel; la ficha del alumno pasó de 193 s a 1,6 s.
    technologies: [Python, Django REST Framework, FastAPI, React, TypeScript, Next.js, Shopify, PostgreSQL, SQL Server, Firestore, MongoDB, Celery, GCP Cloud Run, Huawei Cloud, AWS EC2, Docker, Pytest, Sentry, Claude Code]

