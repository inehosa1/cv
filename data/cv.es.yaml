work:
  - name: Rawson BPO
    position: Consultor de Software Fullstack & Backend Python
    location: España (100 % remoto)
    startDate: 2023-10
    summary: Contratado por Rawson BPO como consultor externo para **Thinkia** (cliente final), a cargo de plataformas para SegurCaixa Adeslas, Culligan y SEB Business.
    highlights:
      - "**SegurCaixa Adeslas** (en desarrollo): construyo en solitario la plataforma de venta de seguros para mascotas: API **FastAPI** (107 endpoints, 94 % de cobertura), dos frontends **React 19**, webhooks firmados con **transactional outbox** y CMS visual sin despliegues."
      - "**Culligan España y Portugal:** diseñé y construí casi en solitario (~97 % de 720+ commits en 15 repos) la venta online de suscripciones: funnel en **Shopify**, **8 microservicios Python en GCP Cloud Run** y dashboard de analítica en **Next.js**."
      - Implementé el **webhook** de pedidos Shopify → CRM con verificación HMAC, deduplicación atómica en **Firestore**, reconstrucción automática y reproceso idempotente; el contrato solo se crea tras el pago.
      - Unifiqué 8 servicios en una **librería Python interna versionada** (auth fail-closed, redacción de PII) y monté **CI/CD sin llaves** (OIDC + Workload Identity) con +1.100 tests y cobertura mínima del 90–95 %.
      - Lancé Portugal con resolución **multi-mercado** por petición, migración de catálogo idempotente vía **Shopify GraphQL** y medición server-side (**GA4 Measurement Protocol**, **Meta CAPI**).
      - "**SEB One** (back-office de pagos y facturación, 7 países): principal desarrollador del backend **Django/DRF** (~67 % de 1.450 commits): multi-tenancy, RBAC, notas de crédito, comisiones, reembolsos y disputas; ~1.500 tests, 88 % de cobertura."
      - Construí un ETL Excel → **Parquet** → PostgreSQL (~590k líneas de factura) y parsers de liquidaciones para 9+ pasarelas de pago (Adyen, PayPal, Klarna, Alma…); migré servicios y almacenamiento de **GCP a Huawei Cloud**.
      - "**SEB Markets** (Amazon, eBay, Miravia, Mirakl, Fnac): asignado a pruebas e integración; reforcé la API pública **FastAPI** según OWASP Top 10 (vulnerabilidades de dependencias 28 → 0; 506 tests, 99 % de cobertura) y añadí reintentos con backoff y colas de reintento."
    technologies: [Python, Django REST Framework, FastAPI, Flask, React, TypeScript, Next.js, Shopify, PostgreSQL, Firestore, MongoDB, Celery, Redis, GCP Cloud Run, Huawei Cloud, Docker, Jenkins, Pytest, Sentry, Claude Code]

